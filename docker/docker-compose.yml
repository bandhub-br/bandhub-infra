services:
  postgres:
    image: postgres:16.4
    container_name: bandhub-postgres
    environment:
      POSTGRES_USER: bandhub
      POSTGRES_PASSWORD: bandhub
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandhub -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: bandhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: bandhub-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bandhub-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: bandhub-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ── Migration runners (run once and exit) ──────────────────────────────────
  migrate-userservice:
    build:
      context: ../../BandHub.UserService
      dockerfile: Dockerfile.Migrations
    container_name: bandhub-migrate-userservice
    environment:
      - ConnectionStrings__DefaultConnection=Host=bandhub-postgres;Port=5432;Database=users_db;Username=bandhub;Password=bandhub
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-bandservice:
    build:
      context: ../../BandHub.BandService
      dockerfile: Dockerfile.Migrations
    container_name: bandhub-migrate-bandservice
    environment:
      - ConnectionStrings__DefaultConnection=Host=bandhub-postgres;Port=5432;Database=bands_db;Username=bandhub;Password=bandhub
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Application services ────────────────────────────────────────────────────
  bandhub-authservice:
    build:
      context: ../../BandHub.AuthService
      dockerfile: Dockerfile
    container_name: bandhub-authservice
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=bandhub-postgres;Port=5432;Database=users_db;Username=bandhub;Password=bandhub
      - Jwt__Key=nfGVSc3OkM0KhjYzEJHhUT3GtNTuagEDatdqYXdxJye
      - Jwt__Issuer=BandHub.AuthService
      - Jwt__Audience=BandHub.AuthService
    depends_on:
      migrate-userservice:
        condition: service_completed_successfully
    restart: unless-stopped

  bandhub-userservice:
    build:
      context: ../../BandHub.UserService
      dockerfile: Dockerfile
    container_name: bandhub-userservice
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=bandhub-postgres;Port=5432;Database=users_db;Username=bandhub;Password=bandhub
      - Jwt__Key=nfGVSc3OkM0KhjYzEJHhUT3GtNTuagEDatdqYXdxJye
      - Jwt__Issuer=BandHub.AuthService
      - Jwt__Audience=BandHub.AuthService
    depends_on:
      migrate-userservice:
        condition: service_completed_successfully
    restart: unless-stopped

  bandhub-bandservice:
    build:
      context: ../../BandHub.BandService
      dockerfile: Dockerfile
    container_name: bandhub-bandservice
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=bandhub-postgres;Port=5432;Database=bands_db;Username=bandhub;Password=bandhub
      - Jwt__Key=nfGVSc3OkM0KhjYzEJHhUT3GtNTuagEDatdqYXdxJye
      - Jwt__Issuer=BandHub.AuthService
      - Jwt__Audience=BandHub.AuthService
    depends_on:
      migrate-bandservice:
        condition: service_completed_successfully
    restart: unless-stopped

  bandhub-bff:
    build:
      context: ../../BandHub.Bff
      dockerfile: Dockerfile
    container_name: bandhub-bff
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - Services__AuthServiceBaseUrl=http://bandhub-authservice:8080
      - Services__UserServiceBaseUrl=http://bandhub-userservice:8080
      - Services__BandServiceBaseUrl=http://bandhub-bandservice:8080
      - Jwt__Key=nfGVSc3OkM0KhjYzEJHhUT3GtNTuagEDatdqYXdxJye
      - Jwt__Issuer=BandHub.AuthService
      - Jwt__Audience=BandHub.AuthService
    depends_on:
      migrate-userservice:
        condition: service_completed_successfully
      bandhub-authservice:
        condition: service_started
      bandhub-userservice:
        condition: service_started
      bandhub-bandservice:
        condition: service_started
    restart: unless-stopped

  bandhub-gateway:
    build:
      context: ../../BandHub.Gateway
      dockerfile: Dockerfile
    container_name: bandhub-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address=http://bandhub-authservice:8080
      - ReverseProxy__Clusters__accounts-cluster__Destinations__destination1__Address=http://bandhub-userservice:8080
      - ReverseProxy__Clusters__bands-cluster__Destinations__destination1__Address=http://bandhub-bandservice:8080
      - ReverseProxy__Clusters__bff-cluster__Destinations__destination1__Address=http://bandhub-bff:8080
      - Cors__AllowedOrigins__0=http://localhost:4200
    depends_on:
      migrate-userservice:
        condition: service_completed_successfully
      bandhub-bff:
        condition: service_started
      bandhub-authservice:
        condition: service_started
      bandhub-userservice:
        condition: service_started
      bandhub-bandservice:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: